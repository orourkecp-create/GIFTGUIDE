<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Secret Santa Gift Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@400;500;600;700&family=Mountains+of+Christmas:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: a night-sky North Pole band (snow, lights, scene) over a cream catalog.
   People are wrapped presents on the home page; each opens into a one-screen shopping file
   that puts sizes first, then wishlist and "avoid", so it works standing in a store. */
:root{
  --bg:#F6EEDC; --surface:#FFFBF1; --surface-2:#F9F0DA; --ink:#1B2B22; --muted:#56675C; --line:#E0D1B1;
  --green:#14452F; --green-2:#1F6444; --red:#B3202A; --red-ink:#A51D26; --gold:#C99A2E; --gold-ink:#7A5808; --gold-soft:#F5E7BD;
  --btn-bg:#B3202A; --btn-ink:#FFF8EC; --naughty-bg:#FBE8E4; --naughty-line:#D88C88;
  --sky-top:#0A2619; --sky-bot:#14452F; --sky-ink:#FBF3E1; --sky-mute:#D9E3D5;
  --art-snow:#FFFFFF; --art-snow-2:#E9EFF0; --art-tree:#2C8A5A; --art-tree-2:#1F6B45; --art-trunk:#6B4226;
  --art-red:#D12F38; --art-gold:#E8B93E; --art-cream:#F6EAD0; --art-green:#1F7A4F; --art-blue:#57B5E6;
  --font-display:'Mountains of Christmas','Bradley Hand',Georgia,serif;
  --font-body:'Fredoka',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-hand:'Caveat','Bradley Hand','Segoe Print',cursive;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1F17; --surface:#15301F; --surface-2:#1B3A2A; --ink:#F3EAD3; --muted:#A9BBAD; --line:#2D4D3C;
    --green:#2E8B5F; --green-2:#26734D; --red:#D14550; --red-ink:#FF9296; --gold:#E4B84C; --gold-ink:#EBC970; --gold-soft:#3A3516;
    --btn-bg:#B9303A; --btn-ink:#FFF8EC; --naughty-bg:#3A1C1F; --naughty-line:#8A3C42;
    --sky-top:#061510; --sky-bot:#0F3524; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1F17; --surface:#15301F; --surface-2:#1B3A2A; --ink:#F3EAD3; --muted:#A9BBAD; --line:#2D4D3C;
  --green:#2E8B5F; --green-2:#26734D; --red:#D14550; --red-ink:#FF9296; --gold:#E4B84C; --gold-ink:#EBC970; --gold-soft:#3A3516;
  --btn-bg:#B9303A; --btn-ink:#FFF8EC; --naughty-bg:#3A1C1F; --naughty-line:#8A3C42;
  --sky-top:#061510; --sky-bot:#0F3524; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button,[role=button]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}

/* ---------- Sky band ---------- */
.sky{position:relative;overflow:hidden;isolation:isolate;color:var(--sky-ink);background:linear-gradient(180deg,var(--sky-top),var(--sky-bot))}
.sky canvas,.stars{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;border-radius:50%;background:#FFF1BF;animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.lights{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-around;padding-inline:6px;pointer-events:none}
.lights::before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:#07150E}
.lights i{position:relative;margin-top:7px;width:9px;height:13px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;background:var(--art-red);box-shadow:0 0 10px 2px var(--art-red);animation:tw 2.4s ease-in-out infinite}
.lights i:nth-child(4n+2){background:var(--art-gold);box-shadow:0 0 10px 2px var(--art-gold);animation-delay:.6s}
.lights i:nth-child(4n+3){background:#58C98E;box-shadow:0 0 10px 2px #58C98E;animation-delay:1.2s}
.lights i:nth-child(4n+4){background:var(--art-blue);box-shadow:0 0 10px 2px var(--art-blue);animation-delay:1.8s}
.sky-inner{position:relative;z-index:1}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--art-gold)}

.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:8px 28px;align-items:end;padding-top:52px}
.hero-text{padding-bottom:44px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hero h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.6rem,7.4vw,4.5rem);line-height:1.02}
.hero .sub{font-size:1.12rem;max-width:34em;color:var(--sky-mute)}
.hand{font-family:var(--font-hand);font-size:1.6rem;line-height:1.1;color:var(--art-gold)}
.scene{display:block;width:100%;max-width:560px;height:auto;justify-self:end;margin-bottom:-1px}

.psky{padding-top:50px;padding-bottom:30px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--sky-ink);cursor:pointer;font-weight:600}
@media (hover:hover){.back:hover{background:rgba(255,255,255,.2)}}
.phead{display:flex;gap:18px;align-items:center;min-width:0}
.phead h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.6rem,9vw,4.2rem);line-height:1.02;overflow-wrap:anywhere}
.phead .meta{display:flex;flex-direction:column;gap:6px;min-width:0}

/* ---------- Avatars (ornaments) ---------- */
.orn{position:relative;flex:none;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;margin-top:8px;font-family:var(--font-display);font-size:2.3rem;color:#FFF8EC;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.5),transparent 38%),var(--hue);box-shadow:inset 0 -6px 10px rgba(0,0,0,.22),0 6px 14px -6px rgba(0,0,0,.5)}
.orn::before{content:"";position:absolute;top:-9px;left:50%;width:16px;height:11px;transform:translateX(-50%);background:var(--art-gold);border-radius:3px 3px 0 0}
.orn::after{content:"";position:absolute;top:-17px;left:50%;width:12px;height:12px;transform:translateX(-50%);border:2px solid var(--art-gold);border-bottom:0;border-radius:12px 12px 0 0}
.orn.lg{width:88px;height:88px;font-size:3.3rem}
.hue-red{--hue:var(--art-red);--rib:var(--art-gold)}
.hue-green{--hue:var(--art-green);--rib:var(--art-gold)}
.hue-gold{--hue:#C58F1A;--rib:var(--art-red)}

/* ---------- Home ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;padding-block:34px 14px}
.toolbar h2{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,5vw,2.8rem)}
.toolbar .hand{color:var(--red-ink)}
.search{display:flex;flex-direction:column;gap:4px;width:min(100%,320px)}
.search label{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.search input{width:100%;min-height:46px;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.search input:focus{border-color:var(--gold);outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:34px 26px;padding-block:14px 12px}
.gift{position:relative;margin-top:18px;padding:0 20px 20px;background:var(--surface);border:1px solid var(--line);border-radius:4px 4px 16px 16px;box-shadow:0 18px 26px -22px rgba(0,0,0,.55);cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;min-width:0}
@media (hover:hover){.gift:hover{transform:translateY(-4px);box-shadow:0 24px 30px -22px rgba(0,0,0,.6)}}
.lid{position:relative;height:46px;margin:-18px -8px 0;border-radius:6px;background:var(--hue);box-shadow:0 5px 8px -4px rgba(0,0,0,.35);transition:transform .3s ease}
@media (hover:hover){.gift:hover .lid{transform:translateY(-6px) rotate(-1.2deg)}}
.lid::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:22px;transform:translateX(-50%);background:var(--rib)}
.bow{position:absolute;left:50%;top:-24px;width:66px;transform:translateX(-50%);z-index:2;fill:var(--rib);filter:drop-shadow(0 2px 1px rgba(0,0,0,.3))}
.who{display:flex;gap:14px;align-items:center;margin-top:24px;min-width:0}
.who h3{font-family:var(--font-display);font-weight:700;font-size:2.3rem;line-height:1;overflow-wrap:anywhere}
.stamp{display:inline-block;margin-top:4px;font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-2)}
:root[data-theme="dark"] .stamp{color:#7FD1A3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stamp{color:#7FD1A3}}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 18px}
.tag{font-size:.82rem;padding:3px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:46px;padding:11px 16px;border:0;border-radius:10px;background:var(--btn-bg);color:var(--btn-ink);font-weight:700;cursor:pointer}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}}
.empty{grid-column:1/-1;padding:40px 16px;text-align:center;color:var(--muted)}
.empty .hand{display:block;color:var(--red-ink);font-size:1.8rem}

/* ---------- Profile ---------- */
.switch{display:flex;gap:8px;overflow-x:auto;padding-block:16px 6px;align-items:center}
.switch .lbl{flex:none;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pill{flex:none;min-height:46px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.pill[aria-current="true"]{background:var(--green);border-color:var(--green);color:#FFF8EC}
.cheat{margin-block:14px 8px;padding:20px 22px;border:2px dashed var(--gold);border-radius:14px;background:var(--gold-soft);display:flex;flex-direction:column;gap:10px}
.cheat .kick{font-size:.76rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink)}
.cheat h2{font-family:var(--font-display);font-weight:700;font-size:2rem}
.cheat p{max-width:62ch}
.cheat b{font-weight:700}
.copy{align-self:flex-start;min-height:46px;padding:8px 18px;border-radius:10px;border:2px solid var(--ink);background:transparent;font-weight:700;cursor:pointer}
@media (hover:hover){.copy:hover{background:var(--surface)}}
.copyout{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.block{padding-block:24px 8px}
.bh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bh .ico{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:var(--gold-soft);font-size:1.3rem}
.bh h2{font-family:var(--font-display);font-weight:700;font-size:2rem;line-height:1.05}
.bh .note{display:block;font-family:var(--font-hand);font-size:1.3rem;line-height:1;color:var(--red-ink);margin-top:2px}
.sizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.size{position:relative;padding:16px 14px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--surface);min-width:0}
.size .k{font-size:.76rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.size .v{font-family:var(--font-body);font-weight:600;font-size:clamp(1.9rem,6vw,2.4rem);line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.wish{position:relative;padding:16px 16px 16px 42px;border:1px solid var(--line);border-radius:4px 14px 14px 4px;background:var(--surface);display:flex;flex-direction:column;gap:6px;min-width:0}
.wish::before{content:"";position:absolute;left:14px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.badge{align-self:flex-start;font-size:.74rem;font-weight:700;letter-spacing:.05em;padding:2px 10px;border-radius:999px;background:var(--gold-soft);color:var(--gold-ink)}
.badge.exp{background:#DDEBFA;color:#1B4C7A}
:root[data-theme="dark"] .badge.exp{background:#1C3550;color:#A9D2F5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.exp{background:#1C3550;color:#A9D2F5}}
.wish h3{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1.15;overflow-wrap:anywhere}
.wish p{font-size:.92rem;color:var(--muted)}
.naughty{padding:20px;border:2px dashed var(--naughty-line);border-radius:14px;background:var(--naughty-bg)}
.naughty .bh .ico{background:var(--red);color:#FFF8EC}
.nlist{display:flex;flex-wrap:wrap;gap:10px}
.nchip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--naughty-line);font-weight:700;font-size:1.05rem}
.quote{margin-top:12px;color:var(--muted);font-size:.95rem}
.favs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.fav{padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.fav h3{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;padding:5px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;overflow-wrap:anywhere}
.chip small{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.foot{padding-block:44px 56px;text-align:center;color:var(--muted)}
.foot .hand{display:block;font-size:2rem;color:var(--red-ink)}
.foot p+p{margin-top:6px;font-size:.9rem}

.cane{height:12px;background:repeating-linear-gradient(-45deg,var(--art-red) 0 12px,#FFF8EC 12px 24px)}
.badge{transform:rotate(-2deg)}
.wish{transition:transform .2s ease}
.wish:nth-child(odd){transform:rotate(-.6deg)}
.wish:nth-child(even){transform:rotate(.6deg)}
@media (hover:hover){.wish:hover{transform:rotate(0) translateY(-3px)}}
@media (hover:hover){.gift:hover .orn{animation:wob .6s ease}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}60%{transform:rotate(10deg)}}
.btn{transition:transform .15s ease,filter .15s ease}
.btn:active{transform:scale(.96)}
.btn.big{width:auto;min-width:min(100%,300px);padding:14px 30px;border-radius:999px;font-size:1.25rem;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.btn.big:active{box-shadow:0 2px 0 rgba(0,0,0,.35);transform:translateY(4px)}
.hero-text .back{align-self:flex-start}
.pop{position:fixed;z-index:50;pointer-events:none;font-size:1.5rem;animation:pop .95s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}
.ws{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:56px}
.ws h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.7rem,9vw,5rem);line-height:1;max-width:14em}
.ws .sub{max-width:32em;color:var(--sky-mute);font-size:1.12rem}
.ws-scene{display:block;width:100%;max-width:780px;height:auto;margin-top:6px;margin-bottom:-1px}
.smoke{fill:#fff;opacity:0;transform-box:fill-box;transform-origin:center;animation:smoke 4.2s ease-out infinite}
.smoke:nth-of-type(2){animation-delay:1.4s}
.smoke:nth-of-type(3){animation-delay:2.8s}
@keyframes smoke{0%{opacity:.75;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(16px,-52px) scale(1.7)}}
.win{animation:flick 3s ease-in-out infinite}
.win.w2{animation-delay:1.1s}
@keyframes flick{0%,100%{opacity:1}50%{opacity:.78}}
.belt{animation:belt 6s linear infinite}
@keyframes belt{to{transform:translateX(-120px)}}
.sleigh{animation:fly 18s linear infinite}
@keyframes fly{from{transform:translate(-230px,40px)}to{transform:translate(920px,6px)}}
.bulb{animation:tw 2s ease-in-out infinite}
.door-hit{cursor:pointer}
.door{transform-box:fill-box;transform-origin:left center;transition:transform .7s cubic-bezier(.3,.7,.3,1)}
@media (hover:hover){.door-hit:hover .door{transform:scaleX(.88)}}
.glow{opacity:.35;transition:opacity .6s ease}
.opening .door{transform:scaleX(.12)}
.opening .glow{opacity:1}
.sign{font-family:var(--font-display);font-weight:700}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;padding-block:34px 4px}
.step{padding:18px 16px;border:2px dashed var(--gold);border-radius:16px;background:var(--surface);text-align:center}
.step .e{font-size:2rem;display:block}
.step h3{font-family:var(--font-display);font-weight:700;font-size:1.7rem;line-height:1.1;margin-top:4px}
.step p{font-size:.92rem;color:var(--muted);margin-top:4px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:6px;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:2px solid var(--line);box-shadow:0 -8px 20px -12px rgba(0,0,0,.4)}
.dock button{flex:1;max-width:200px;min-height:50px;border:0;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:.88rem;line-height:1.1;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dock button b{font-size:1.25rem;font-weight:400;line-height:1}
.dock button:active{background:var(--gold-soft)}
body.has-dock{padding-bottom:calc(78px + env(safe-area-inset-bottom,0px))}
.block{scroll-margin-top:12px}
@media (min-width:700px){body{font-size:17px}}
@media (min-width:1100px){.dock{display:none}body.has-dock{padding-bottom:0}}
@media (max-width:480px){
  .sizes{grid-template-columns:repeat(2,1fr)}
  .cheat{padding:18px 16px}
  .naughty{padding:16px}
  .grid{gap:30px 0}
  .ws{padding-top:44px}
  .toolbar{padding-top:26px}
}

.elfbox{margin-top:14px;padding:10px 10px 12px;border-radius:12px;background:var(--surface-2);text-align:center}
.elf{display:block;width:100%;max-width:190px;height:auto;margin:0 auto}
.tbdnote{font-family:var(--font-hand);font-size:1.35rem;line-height:1.1;color:var(--red-ink);margin-top:2px}
.tbdp{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:34px}
.tbdp h2{font-family:var(--font-display);font-weight:700;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;max-width:16em}
.tbdp .elf{max-width:300px}
.tbdp .hand{font-size:2.4rem;color:var(--red-ink)}
.tbdp p:last-child{max-width:34em;color:var(--muted)}
.elf-hammer{transform-origin:66px 60px;animation:hit .9s ease-in-out infinite}
@keyframes hit{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(16deg)}}
.spark{animation:tw .9s ease-in-out infinite}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;padding-top:48px}
  .hero-text{padding-bottom:8px}
  .scene{justify-self:center}
  .phead{align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

</head>
<body>
<header class="sky" id="sky">
  <canvas id="snow" aria-hidden="true"></canvas>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="lights" id="lights" aria-hidden="true"></div>
  <div class="wrap sky-inner" id="skyInner"></div>
</header>
<div class="cane" aria-hidden="true"></div>
<main class="wrap" id="main"></main>
<footer class="wrap foot">
  <span class="hand">Santa’s got receipts.</span>

/* ---------- Routing ---------- */
var current = null;
function byId(id){ return PEOPLE.filter(function(p){ return p.id === id; })[0]; }
function route(id, force){
  var p = byId(id);
  var key = p ? p.id : (id === 'home' ? 'home' : 'workshop');
  if (key === current && !force) return;
  current = key;
  if (p) { $('#skyInner').innerHTML = profileSky(p); $('#main').innerHTML = profileMain(p); document.title = p.name + '’s Gift Guide'; }
  else if (key === 'home') { $('#skyInner').innerHTML = homeSky(); $('#main').innerHTML = homeMain(); fillGrid(''); document.title = 'Secret Santa Gift Guide'; }
  else { $('#skyInner').innerHTML = workshopSky(); $('#main').innerHTML = workshopMain(); document.title = 'Secret Santa Gift Guide'; }
  var dock = $('#dock');
  document.body.classList.toggle('has-dock', !!(p && !p.tbd));
  if (p && !p.tbd) {
    var b = '<button type="button" data-go="home"><b>←</b>All</button>';
    [['sec-sizes','👕','Sizes'],['sec-wish','🎁','Wishlist'],['sec-skip','🚫','Skip'],['sec-favs','❤️','Faves']].forEach(function(j){
      if ($('#' + j[0])) b += '<button type="button" data-jump="' + j[0] + '"><b>' + j[1] + '</b>' + j[2] + '</button>';
    });
    dock.innerHTML = b; dock.hidden = false;
  } else { dock.hidden = true; dock.innerHTML = ''; }
  window.scrollTo(0, 0);
  var h = $('#skyInner h1'); if (h) h.focus({preventScroll:true});
}
function go(id){
  try { if (location.hash !== '#' + id) location.hash = id; } catch (e) {}
  route(id);
}
document.addEventListener('click', function(e){
  var en = e.target.closest('[data-enter]');
  if (en) { e.preventDefault(); enter(e, en); return; }
  var jm = e.target.closest('[data-jump]');
  if (jm) { var tg = document.getElementById(jm.getAttribute('data-jump')); if (tg) tg.scrollIntoView({behavior: REDUCE ? 'auto' : 'smooth', block: 'start'}); return; }
  var t = e.target.closest('[data-go]');
  if (t) { e.preventDefault(); if (t.closest('.gift')) burst(e, t); go(t.getAttribute('data-go')); return; }
  var c = e.target.closest('#copySizes');
  if (c) copySizes(c);
});
document.addEventListener('input', function(e){ if (e.target.id === 'search') fillGrid(e.target.value); });
window.addEventListener('hashchange', function(){ route(location.hash.replace('#', '')); });

function copySizes(btn){
  var p = byId(current); if (!p) return;
  var text = p.name + '’s sizes: ' + p.sizes.map(function(s){ return s[0] + ' ' + s[1]; }).join(', ');
  var done = function(msg){ btn.textContent = msg; setTimeout(function(){ btn.textContent = 'Copy sizes 📋'; }, 2200); };
  var fallback = function(){
    if (!$('#copyout')) { var i = document.createElement('input'); i.id = 'copyout'; i.className = 'copyout'; i.readOnly = true; btn.parentNode.appendChild(i); }
    var o = $('#copyout'); o.value = text; o.focus(); o.select(); done('Select and copy below');
  };
  try { navigator.clipboard.writeText(text).then(function(){ done('Copied ✓'); }, fallback); } catch (e) { fallback(); }
}

function workshopSky(){

    + '<h1 tabindex="-1">Welcome to the Secret Santa Workshop</h1>'
    + '<p class="sub">The elves have been collecting intel. Step inside to see what everyone wants, what fits and what to leave at the North Pole.</p>'
    + '<button class="btn big" type="button" data-enter>Step inside the workshop 🎁</button>'
    + workshopScene() + '</div>';
}
function workshopMain(){
  return '<div class="steps">'
    + '<div class="step"><span class="e">🎁</span><h3>Pick a name</h3><p>Everyone gets their own gift guide.</p></div>'
    + '<div class="step"><span class="e">👕</span><h3>Check the sizes</h3><p>Sizes come first, so you can shop from your phone.</p></div>'
    + '<div class="step"><span class="e">🎄</span><h3>Shop with confidence</h3><p>Wishlist, favorites and the Naughty List in one place.</p></div></div>';
}
function burst(e, el){
  if (REDUCE) return;
  var x = e.clientX, y = e.clientY;
  if (!x && !y && el) { var r = el.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  var em = ['🎁','⭐','❄️','🔔','🎄','🍪'];
  for (var i = 0; i < 12; i++) {
    var n = document.createElement('span'), a = Math.random() * 6.283, d = 70 + Math.random() * 90;
    n.className = 'pop'; n.textContent = em[i % em.length]; n.setAttribute('aria-hidden', 'true');
    n.style.left = x + 'px'; n.style.top = y + 'px';
    n.style.setProperty('--dx', Math.round(Math.cos(a) * d) + 'px'); n.style.setProperty('--dy', Math.round(Math.sin(a) * d - 30) + 'px'); n.style.setProperty('--r', Math.round(Math.random() * 360 - 180) + 'deg');
    document.body.appendChild(n);
    setTimeout((function(m){ return function(){ if (m.parentNode) m.parentNode.removeChild(m); }; })(n), 1000);
  }
}
var entering = false;
function enter(e, el){
  if (entering) return;
  entering = true;
  var svg = $('.ws-scene'); if (svg) svg.classList.add('opening');
  burst(e, el);
  setTimeout(function(){ entering = false; go('home'); }, REDUCE ? 0 : 850);
}
document.addEventListener('keydown', function(e){
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('.door-hit')) { e.preventDefault(); enter(e, e.target); }
});

/* ---------- Atmosphere: stars, lights, snow (all decorative) ---------- */
(function(){
  var st = $('#stars'), s = '';
  for (var i = 0; i < 22; i++) {
    var z = (Math.random() * 2 + 1.5).toFixed(1);
    s += '<span class="star" style="left:' + (Math.random() * 100).toFixed(1) + '%;top:' + (8 + Math.random() * 60).toFixed(1) + '%;width:' + z + 'px;height:' + z + 'px;animation-delay:' + (Math.random() * 3).toFixed(1) + 's"></span>';
  }
  st.innerHTML = s;
  var l = ''; for (var j = 0; j < 28; j++) l += '<i></i>';
  $('#lights').innerHTML = l;

  var cv = $('#snow'), sky = $('#sky'), ctx = cv.getContext('2d'), w = 0, h = 0, fl = [], raf = 0;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function mk(){ return { x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2.2 + 0.8, v: Math.random() * 0.6 + 0.25, p: Math.random() * 6.28 }; }
  function draw(t){
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    for (var k = 0; k < fl.length; k++) {
      var f = fl[k];
      if (!reduce) { f.y += f.v; f.x += Math.sin(t / 900 + f.p) * 0.25; if (f.y > h + 4) { f.y = -4; f.x = Math.random() * w; } }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.2832); ctx.fill();
    }
  }
  function fit(){
    var r = sky.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    w = r.width; h = r.height;
    cv.width = Math.round(w * d); cv.height = Math.round(h * d); ctx.setTransform(d, 0, 0, d, 0, 0);
    var n = Math.max(24, Math.min(80, Math.round(w * h / 9000)));
    while (fl.length < n) fl.push(mk());
    fl.length = n;
    if (reduce) draw(0);
  }
  function loop(t){ draw(t); raf = requestAnimationFrame(loop); }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(sky); else window.addEventListener('resize', fit);
  if (!reduce) {
    raf = requestAnimationFrame(loop);
    document.addEventListener('visibilitychange', function(){
      if (document.hidden) cancelAnimationFrame(raf); else raf = requestAnimationFrame(loop);
    });
  }
})();

route(location.hash.replace('#', ''), true);
